<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Full background (iOS will mask to squircle) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Flame outer -->
  <path fill="url(#flame)" d="
    M256 72
    C 260 130, 320 150, 340 210
    C 360 270, 340 320, 310 340
    C 340 305, 330 270, 305 250
    C 305 290, 280 310, 260 320
    C 280 290, 270 260, 250 250
    C 245 295, 220 320, 195 335
    C 165 345, 130 320, 130 270
    C 130 220, 175 200, 200 160
    C 220 130, 220 100, 210 80
    C 230 95, 245 110, 256 72
    Z"/>

  <!-- Flame inner (hot core) -->
  <path fill="url(#flameInner)" d="
    M250 200
    C 255 230, 285 245, 290 280
    C 295 315, 270 335, 240 335
    C 215 335, 195 320, 190 295
    C 185 270, 205 250, 225 240
    C 240 230, 245 215, 250 200
    Z" opacity="0.9"/>

  <!-- Text TDEE -->
  <text x="256" y="450"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="78"
        font-weight="900"
        text-anchor="middle"
        fill="white"
        letter-spacing="4">TDEE</text>
</svg>
